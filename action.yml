name: Quality ratchet
description: Check repository-owned quality policy with isolated, locked scanners.
inputs:
  github-token:
    description: Read-only token for this pull request and repository.
    required: true
  repository-path:
    description: Git checkout inside the workspace.
    default: ${{ github.workspace }}
outputs:
  outcome:
    description: Final policy outcome.
    value: ${{ steps.run.outputs.outcome }}
  strict-exit-code:
    description: Strict configured verdict before PR exception policy.
    value: ${{ steps.run.outputs.strict-exit-code }}
  report-directory:
    description: Directory containing available evidence and summary.
    value: ${{ steps.run.outputs.report-directory }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        package-manager-cache: false
    - id: run
      shell: bash
      env:
        QR_ACTION_PATH: ${{ github.action_path }}
        QR_REPOSITORY_PATH: ${{ inputs.repository-path }}
        QR_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: env -u NODE_OPTIONS -u NODE_PATH node "$QR_ACTION_PATH/scripts/bootstrap-tool.mjs"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.run.outputs.report-directory != '' }}
      with:
        name: quality-results-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.report-directory }}
        retention-days: 7
        if-no-files-found: error
    - shell: bash
      if: ${{ !cancelled() }}
      env:
        QR_ACTION_PATH: ${{ github.action_path }}
        QR_REPORT_DIRECTORY: ${{ steps.run.outputs.report-directory }}
      run: env -u NODE_OPTIONS -u NODE_PATH node "$QR_ACTION_PATH/scripts/finish-action.mjs"
