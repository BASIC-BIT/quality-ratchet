# v1.1.1 candidate for qualification only. Publish and verify its tag before activation.
# See docs/releases.md and docs/adoption.md before enabling enforcement.
name: Code quality
on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        edited,
        labeled,
        unlabeled,
      ]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    name: Code quality ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: BASIC-BIT/quality-ratchet@ecd923b730aae0857733a38e25589ca70699bc39 # v1.1.1
        with:
          github-token: ${{ github.token }}
          repository-path: ${{ github.workspace }}
